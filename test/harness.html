<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>card harness</title>
  </head>
  <body>
    <div id="host" style="width: 703px; height: 320px"></div>
    <script>
      for (const tag of ["ha-card", "ha-icon", "ha-icon-button", "ha-form"]) {
        if (!customElements.get(tag))
          customElements.define(tag, class extends HTMLElement {});
      }
      const now = Date.now();
      const forecast = Array.from({ length: 48 }, (_, i) => ({
        datetime: new Date(
          Math.floor(now / 3.6e6) * 3.6e6 + i * 3.6e6,
        ).toISOString(),
        condition: ["cloudy", "partlycloudy", "rainy", "sunny"][i % 4],
        temperature: 8 + 5 * Math.sin(i / 4),
        precipitation: i % 5 === 0 ? 1.2 : 0,
        precipitation_probability: (i * 7) % 100,
        wind_speed: 3 + 2 * Math.sin(i / 3),
        wind_gust_speed: 5 + 3 * Math.sin(i / 3),
        wind_bearing: (i * 30) % 360,
      }));
      window.__hass = {
        states: { "weather.test": {} },
        connection: {
          subscribeMessage(cb) {
            setTimeout(() => cb({ forecast }), 0);
            return Promise.resolve(() => {});
          },
        },
      };
    </script>
    <script type="module">
      import "../dist/weather-meteogram-card.js";
      const el = document.createElement("weather-meteogram-card");
      el.setConfig({ entity: "weather.test", title: "Test" });
      document.getElementById("host").appendChild(el);
      el.hass = window.__hass;
      window.__card = el;
    </script>
  </body>
</html>
